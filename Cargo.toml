[workspace]
members = ["crates/galaw"]
resolver = "2"

[workspace.dependencies]
derive_more = { version = "2.1.1", features = ["add"] }
nalgebra    = "0.30.1"
roxmltree   = "0.20.0"
thiserror   = "2.0.19"
charming    = { version = "0.6.0", features = ["ssr-raster"] }
criterion   = { version = "0.8.2", features = ["html_reports"] }
rand        = "0.10.2"
rand_chacha = "0.10.0"
serde_json  = "1"
sysinfo     = "0.39.6"
k           = "0.32.0"
rayon       = "1"

[profile.release]
lto = true
codegen-units = 1
