[workspace]
members = ["crates/galaw"]
resolver = "2"

[workspace.dependencies]
derive_more = { version = "2.1.1", features = ["add"] }
nalgebra    = "0.30.1"
roxmltree   = "0.20.0"
thiserror   = "2.0.19"
criterion   = { version = "0.8.2", features = ["html_reports"] }
rand        = "0.10.2"
rand_chacha = "0.10.0"
sysinfo     = "0.39.6"
k           = "0.32.0"
rayon       = "1"
rs-pinocchio    = "4.1.1"
nalgebra-latest = { package = "nalgebra", version = "0.33" }

[profile.release]
lto = true
codegen-units = 1
